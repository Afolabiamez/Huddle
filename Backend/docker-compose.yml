version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: huddle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: huddle
      POSTGRES_PASSWORD: huddle_local_pw
      POSTGRES_DB: huddle_db
    ports:
      - '5434:5432'
    volumes:
      - huddle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U huddle -d huddle_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  huddle_pgdata:
